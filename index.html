<!doctype html>
<html lang="en">
  <head>
    <script>
  window.addEventListener('error', function(e) {
    var b = document.createElement('pre');
    b.style = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;color:#f55;padding:20px;z-index:999999;font-size:14px;overflow:auto;';
    b.textContent = 'CRASH:\n' + e.message + '\n\nAt: ' + e.filename + ':' + e.lineno + '\n\nStack:\n' + (e.error ? e.error.stack : 'no stack');
    document.body.appendChild(b);
  });
  window.addEventListener('unhandledrejection', function(e) {
    var b = document.createElement('pre');
    b.style = 'position:fixed;top:0;left:0;width:100vw;height:100vh;background:#000;color:#fa0;padding:20px;z-index:999999;font-size:14px;overflow:auto;';
    b.textContent = 'PROMISE REJECTION:\n' + (e.reason && e.reason.stack ? e.reason.stack : e.reason);
    document.body.appendChild(b);
  });
    </script>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/bitchordweb/vite.svg" />
    <link rel="apple-touch-icon" href="/bitchordweb/icons/icon-192x192.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="theme-color" content="#12101b" />
    <meta name="description" content="BitChord TV - High fidelity YouTube Music client tailored for TV and responsive web" />
    <title>BitChord TV</title>
    <!-- GitHub Pages Single Page Apps script for subpath routing -->
    <script type="text/javascript">
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location))
    </script>
  </head>
  <body class="bg-[#14121b] text-white selection:bg-red-500 selection:text-white min-h-screen overflow-x-hidden overflow-y-auto select-none">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
